name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main          # deploy on every push to main
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve site address
        env:
          CONFIGURED_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const base = repo.toLowerCase() === `${owner}.github.io`.toLowerCase() ? '' : `/${repo}`;
          const url = new URL(process.env.CONFIGURED_SITE_URL || `https://${owner}.github.io${base}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `NEXT_PUBLIC_SITE_URL=${url.href.replace(/\/$/, '')}\nNEXT_PUBLIC_BASE_PATH=${url.pathname.replace(/\/$/, '')}\n`);
          JS

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
